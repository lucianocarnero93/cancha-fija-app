<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070b08" />
    <title>Sin conexión · Cancha Fija</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #070b08;
        color: #eef7f0;
        font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
        padding: 24px;
      }
      main { max-width: 360px; text-align: center; }
      h1 { font-size: 1.75rem; margin: 16px 0 8px; }
      p { color: #8fa394; line-height: 1.5; }
      a {
        display: inline-block;
        margin-top: 20px;
        background: #2ee56a;
        color: #06210f;
        text-decoration: none;
        font-weight: 700;
        border-radius: 14px;
        padding: 14px 22px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#2ee56a"/>
        <rect x="7" y="6" width="18" height="20" rx="2" fill="none" stroke="#06210f" stroke-width="1.6"/>
        <circle cx="16" cy="16" r="3.2" fill="none" stroke="#06210f" stroke-width="1.4"/>
      </svg>
      <h1>Estás sin red</h1>
      <p>Cancha Fija sigue abierta offline. Cuando vuelva la señal, recargá para sincronizar el plantel.</p>
      <a href="/">Reintentar</a>
    </main>
  </body>
</html>
